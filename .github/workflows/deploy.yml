name: Déployer sur GitHub Pages

# Construit le portfolio et le publie sur GitHub Pages.
# Le build tourne en local strict : aucune clé de déploiement n'est stockée
# dans le dépôt, tout passe par le token automatique de GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Empêche deux déploiements simultanés, et annule les runs obsolètes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Un site projet (repo "portfolio") est servi sous /portfolio/.
      # Un site utilisateur (repo "Sharly-mod.github.io") est à la racine.
      - name: Calculer les variables de build
        id: config
        run: node .github/set-build-env.mjs "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Construire le site
        run: npm run build
        env:
          SITE_URL: ${{ steps.config.outputs.site }}
          BASE_PATH: ${{ steps.config.outputs.base }}

      - name: Vérifier les liens internes
        run: node .github/check-links.mjs "${{ steps.config.outputs.base }}"

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
