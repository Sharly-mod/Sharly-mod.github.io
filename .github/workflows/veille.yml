name: Archive de veille (manuel)

# Ancienne collecte quotidienne des flux RSS IA & jeu vidéo. Elle est conservée
# uniquement pour archiver les sources : la veille présentée à l'oral est
# écrite à la main dans src/content/veille-e5/.
#
# Plus de déclenchement automatique : le portfolio E5 ne doit pas être noyé
# dans des articles sans rapport avec la sécurité de la chaîne logistique.

on:
  workflow_dispatch:
    inputs:
      jours:
        description: 'Fenêtre de collecte en jours'
        required: false
        default: '30'
      max:
        description: 'Nombre maximum d’articles conservés'
        required: false
        default: '300'

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: true

jobs:
  collecter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Collecter la veille
        run: npm run veille -- --days "${{ inputs.jours || 30 }}" --max "${{ inputs.max || 300 }}"

      - name: Vérifier que le site compile
        run: |
          npm run check
          npm run build

      - name: Publier les nouveaux articles
        run: |
          if git diff --quiet -- src/content/veille public/veille.opml; then
            echo "Aucun nouvel article, rien à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/veille public/veille.opml
          git commit -m "veille: mise à jour automatique des articles"
          git push
